name: ML Pipeline

permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  train-test-deploy:

    if: "!contains(github.event.head_commit.message, 'Auto-update production model')"

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          pytest

      - name: Enable MLflow File Store
        run: |
          echo "MLFLOW_ALLOW_FILE_STORE=true" >> $GITHUB_ENV

      - name: Train All Architectures
        run: |
          python -m src.train

      - name: Validate Best Model Accuracy
        run: |
          python check_accuracy.py

      - name: Commit Production Artifacts
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add -f models/production-model.pth
          git add metrics.json

          git diff --cached --quiet || git commit -m "Auto-update production model"

          git push

      - name: Upload MLflow Runs
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-runs-${{ github.run_number }}
          path: mlruns/

      - name: Upload Best Model
        uses: actions/upload-artifact@v4
        with:
          name: best-model
          path: models/production-model.pth

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: metrics.json

      - name: Deploy To Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl "$RENDER_DEPLOY_HOOK"