name: ML Pipeline

on:
  push:
    branches:
      - main

jobs:

  train-test-deploy:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Enable MLflow File Store
        run: |
          echo "MLFLOW_ALLOW_FILE_STORE=true" >> $GITHUB_ENV

      - name: Train All Architectures
        run: |
          python -m src.train

      - name: Verify MLflow Runs
        run: |
          ls -R mlruns

      - name: Upload MLflow Runs
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-runs-${{ github.run_number }}
          path: mlruns/

      - name: Upload Best Model
        uses: actions/upload-artifact@v4
        with:
          name: best-model
          path: models/production-model.pth

      - name: Upload All Trained Models
        uses: actions/upload-artifact@v4
        with:
          name: all-models
          path: models/*.pth

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: metrics.json

      - name: Check Accuracy
        run: |
          python check_accuracy.py

      - name: Run Tests
        run: |
          pytest

      - name: Deploy To Render
        run: |
          curl "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}